name: Deploy to GitHub Pages

on:
  push:
    branches: [main, Develop]
  workflow_dispatch:

# Least privilege: only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; a newer push waits rather than cancelling,
# so a half-written commit can't overwrite a finished deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The repo name is the Pages subpath. Deriving it here rather than hardcoding
      # keeps the base correct even if the repo is renamed, and avoids case mistakes
      # (Pages paths are case-sensitive).
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Pages must already be enabled with Source = GitHub Actions
      # (Settings -> Pages). The `enablement: true` option can't do it for you unless
      # Actions has read/write repo permissions, which is not the default.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
